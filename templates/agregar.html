{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <!-- TÍTULO -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>➕ Agregar Libro</h2>

        <a href="{{ url_for('index') }}" class="btn btn-secondary">
            ⬅ Volver
        </a>
    </div>

    <!-- FORMULARIO -->
    <div class="card shadow p-4">
        <form method="POST">

            <!-- NOMBRE -->
            <div class="mb-3">
                <label class="form-label">Nombre del libro</label>
                <input type="text" name="nombre" class="form-control" placeholder="Ej: Cien años de soledad" required>
            </div>

            <!-- AUTOR -->
            <div class="mb-3">
                <label class="form-label">Autor</label>
                <input type="text" name="autor" class="form-control" placeholder="Ej: Gabriel García Márquez" required>
            </div
