{% extends "base.html" %}

{% block content %}

<h2>Listado de Libros</h2>

<table class="table table-striped">
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Autor</th>
        <th>Cantidad</th>
        <th>Precio</th>
        <th>Acciones</th>
    </tr>

    {% for libro in libros %}
    <tr>
        <td>{{ libro.id }}</td>
        <td>{{ libro.nombre }}</td>
        <td>{{ libro.autor }}</td>
        <td>{{ libro.cantidad }}</td>
        <td>{{ libro.precio }}</td>
        <td>
            <a href="{{ url_for('editar', id=libro.id) }}" class="btn btn-warning btn-sm">Editar</a>
            <a href="{{ url_for('eliminar', id=libro.id) }}" class="btn btn-danger btn-sm">Eliminar</a>
        </td>
    </tr>
    {% endfor %}
</table>

<a href="{{ url_for('agregar') }}" class="btn btn-primary">Agregar Libro</a>

{% endblock %}
