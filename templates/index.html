<!DOCTYPE html>
<html>
<head>
    <title>Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <h2 class="mb-4">📚 Sistema de Biblioteca</h2>

    <a href="{{ url_for('logout') }}" class="btn btn-danger mb-3">Cerrar sesión</a>
    <a href="{{ url_for('agregar') }}" class="btn btn-success mb-3">Agregar Libro</a>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Autor</th>
                <th>Cantidad</th>
                <th>Precio</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>
        {% for libro in libros %}
            <tr>
                <td>{{ libro.id }}</td>
                <td>{{ libro.nombre }}</td>
                <td>{{ libro.autor }}</td>
                <td>{{ libro.cantidad }}</td>
                <td>${{ libro.precio }}</td>

                <td>
                    <a href="{{ url_for('editar', id=libro.id) }}" class="btn btn-warning btn-sm">
                        Editar
                    </a>

                    <a href="{{ url_for('eliminar', id=libro.id) }}" 
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('¿Seguro que deseas eliminar este libro?')">
                        Eliminar
                    </a>
                </td>
            </tr>
        {% else %}
            <tr>
                <td colspan="6" class="text-center">No hay libros registrados</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>

</div>

</body>
</html>
