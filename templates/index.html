```html
<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>

<div class="container">
    <h1>📖 Lista de Libros</h1>

    <a href="/agregar">➕ Agregar Libro</a> |
    <a href="/reporte">📄 Descargar PDF</a> |
    <a href="/logout">🚪 Salir</a>

    <br><br>

    <table border="1">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Autor</th>
            <th>Cantidad</th>
            <th>Precio</th>
            <th>Acciones</th>
        </tr>

        {% for libro in libros %}
        <tr>
            <td>{{ libro.id }}</td>
            <td>{{ libro.nombre }}</td>
            <td>{{ libro.autor }}</td>
            <td>{{ libro.cantidad }}</td>
            <td>{{ libro.precio }}</td>
            <td>
                <a href="/editar/{{ libro.id }}">✏️</a>
                <a href="/eliminar/{{ libro.id }}">🗑️</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>

</body>
</html>
```
