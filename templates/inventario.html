{% extends "base.html" %}

{% block content %}
<h2>Inventario</h2>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Libro</th>
        <th>Stock</th>
        <th>Ubicación</th>
    </tr>

    {% for i in datos %}
    <tr>
        <td>{{ i.id }}</td>
        <td>{{ i.nombre }}</td>
        <td>{{ i.stock }}</td>
        <td>{{ i.ubicacion }}</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
